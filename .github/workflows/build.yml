name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # `secrets` is NOT an available context in a step-level `if` (referencing it there
    # fails workflow validation outright). Job-level `env` *can* read secrets, so the
    # "is a keystore configured?" test is hoisted here and the step tests `env`.
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "ndk;28.2.13676358"

      - name: Restore signing key
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/release.jks
          cat >> local.properties <<EOF
          storeFile=${{ github.workspace }}/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - uses: gradle/actions/setup-gradle@v4

      # proot/talloc are built by a GNUmakefile outside CMake and dropped into jniLibs
      # (gitignored); without this the release APK ships no libproot_exec.so and the
      # Linux sandbox cannot start.
      #
      # ANDROID_NDK_HOME must be pinned explicitly: GitHub runners preset it to their
      # own bundled NDK, which is NOT the version setup-android installed above, and
      # build-proot.sh checks that variable first.
      - name: Build proot native binaries
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          test -d "$ANDROID_NDK_HOME" || { echo "pinned NDK missing: $ANDROID_NDK_HOME"; exit 1; }
          chmod +x ./build-proot.sh && ./build-proot.sh

      - name: Build Release APKs
        run: chmod +x ./gradlew && ./gradlew assembleRelease

      # The name is a contract: the update Worker's CI channel looks for exactly
      # this artifact (see CI_ARTIFACT_NAME in server/update-check/src/index.js).
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: agora-release
          path: app/build/outputs/apk/release/*.apk
